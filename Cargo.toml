[package]
name = "libghostty"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust libghostty grid for Wawona Terminal. Native UI owns chrome."
repository = "https://github.com/Wawona/Ghostty"
rust-version = "1.75"

[lib]
name = "ghostty"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Local dogfood: path. CI / flake: git override or Cargo.lock pin.
wawona-terminal = { path = "../Terminal", optional = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
